name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -race -count=1 ./...
      - run: node --test static/*.test.js

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # espera a aprovação de quem está no Environment; só a main pode usá-lo
    environment: production
    concurrency: deploy-vpsarm
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: chave ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: build e subida na vpsarm
        run: |
          tar czf - --exclude=.git . | ssh -o ServerAliveInterval=30 "$SSH_TARGET" \
            'mkdir -p ~/pad && tar xzf - -C ~/pad && cd ~/pad && { sh deploy.sh >~/pad-deploy.log 2>&1; rc=$?; tail -n 40 ~/pad-deploy.log; exit $rc; }'
      - name: conferir que responde pelo Traefik
        run: |
          ssh "$SSH_TARGET" 'for i in $(seq 10); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --resolve pad.pauloholanda.com.br:443:127.0.0.1 https://pad.pauloholanda.com.br/_login)
            [ "$code" = 200 ] && exit 0; sleep 3
          done; echo "status $code"; docker logs --tail 20 pad-pad-1; exit 1'
